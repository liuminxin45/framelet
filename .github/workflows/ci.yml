name: Windows
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - if: github.event_name == 'schedule'
        run: python scripts/audit_dependencies.py --output work/dependency-audit.json
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - run: python -m pip install pillow psutil
      - run: python scripts/verify.py target/release/framelet.exe
      - run: python scripts/verify_frames.py target/release/framelet.exe
      - run: python scripts/verify_timeline.py target/release/framelet.exe
      - run: python scripts/verify_defense.py target/release/framelet.exe
      - run: python scripts/verify_sync.py target/release/framelet.exe
      - run: python scripts/verify_series.py target/release/framelet.exe --output work/series-ci
      - run: python scripts/verify_60fps.py target/release/framelet.exe --output work/fps60-ci
      - run: python scripts/fuzz_regression.py target/release/framelet.exe --iterations 1000 --seed ${{ github.run_number }} --output work/fuzz-results.json
      - run: python scripts/verify_robustness.py target/release/framelet.exe
      - run: npm install --prefix work/mcp-client @modelcontextprotocol/sdk@1.32.2 --ignore-scripts --no-audit --no-fund
      - run: node scripts/verify_mcp.mjs target/release/framelet.exe
      - run: ./scripts/package.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: framelet-windows-x64
          path: dist/framelet-*-windows-x64.zip
