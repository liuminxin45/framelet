<!doctype html><meta charset="utf-8"><title>Framelet 60 FPS live fixture</title>
<style>body{font:22px system-ui;margin:40px;background:#eef1f5;color:#16243a}canvas{display:block;margin-top:24px;image-rendering:pixelated;border:4px solid #16243a}p{max-width:920px}</style>
<h1>Framelet · Real 60 FPS recording test</h1><p>Local, synthetic scene. Each display update changes the color and visible frame counter. No personal content.</p>
<p id="stats">Starting…</p><canvas id="target" width="640" height="320"></canvas>
<script>
const c=document.querySelector('canvas'),ctx=c.getContext('2d');let count=0,start=performance.now();
function draw(now){count++;ctx.fillStyle=`rgb(${(count*17)%256},${(count*29)%256},${(count*43)%256})`;ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='white';ctx.font='48px monospace';ctx.fillText('FRAME '+count,24,100);ctx.fillText((now-start).toFixed(0)+' ms',24,180);if(count%30===0)document.querySelector('#stats').textContent=`Source updates: ${count} · observed requestAnimationFrame rate: ${(count*1000/(now-start)).toFixed(1)} FPS`;requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script>
